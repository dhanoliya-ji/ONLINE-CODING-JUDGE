version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: online_judge_db

    restart: always

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: online_judge

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

  api:

    build: .

    container_name: online_judge_api

    depends_on:

      - postgres

    ports:

      - "8000:8000"

    env_file:

      - .env

volumes:

  postgres_data: