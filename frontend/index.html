<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b10" />

    <title>Crucible — Online Coding Judge</title>
    <meta
      name="description"
      content="A competitive-programming judge that compiles and runs untrusted code in a locked-down sandbox, then grades it against sample and hidden test suites."
    />

    <!-- Open Graph, so a shared demo link renders with a preview card. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Crucible — Online Coding Judge" />
    <meta
      property="og:description"
      content="Sandboxed code execution, seven verdicts, contests with ICPC scoring. Built with FastAPI, PostgreSQL and Docker."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0b10'/%3E%3Cpath d='M7 10h18l-2.7 14.4a2.7 2.7 0 0 1-2.7 2.2h-7.2a2.7 2.7 0 0 1-2.7-2.2Z' fill='none' stroke='%23ff8a3d' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M13 7c0 1.6 2.4 1.6 2.4 3.2M18 5c0 1.6 2.4 1.6 2.4 3.2' stroke='%237fb4ff' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />

    <!-- Apply the saved theme before first paint, so light mode never flashes dark. -->
    <script>
      try {
        var t = localStorage.getItem("crucible.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        else document.documentElement.dataset.theme = "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
