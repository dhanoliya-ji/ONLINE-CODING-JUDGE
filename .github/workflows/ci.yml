name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    # id-token lets the Codecov upload authenticate with OIDC, so there is no
    # upload token to store as a secret.
    permissions:
      contents: read
      id-token: write

    env:
      # SQLite plus the local sandbox keeps CI free of external services.
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      EXECUTION_BACKEND: local
      ADMIN_EMAILS: admin@example.com
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov==7.1.0

      - name: Lint (Ruff)
        # Rules live in ruff.toml. The version is pinned so a new Ruff
        # release cannot turn CI red without any change to the code.
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.7"
          src: .

      - name: Pull the Python sandbox image
        # The Docker backend never pulls (production pre-pulls, see
        # docs/DEPLOYMENT.md), so without this the real-sandbox test would fail
        # on "image not found" instead of exercising the sandbox.
        run: docker pull python:3.11-slim

      - name: Set up Node.js 24
        # Node 24 runs TypeScript natively; the runner's default Node does not.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Run tests
        env:
          # Every language's toolchain must be present here: a missing one
          # fails the run instead of quietly skipping its tests.
          REQUIRE_ALL_TOOLCHAINS: "1"
          # The runner's rustc is a rustup proxy; the sandbox resets HOME, so
          # point it at the installed toolchains explicitly.
          RUSTUP_HOME: /home/runner/.rustup
          CARGO_HOME: /home/runner/.cargo
          # The runner's first rustc call can stall on toolchain setup, which
          # is not what the language tests are measuring.
          EXECUTION_COMPILE_TIMEOUT_S: "60"
        run: pytest -q --cov=app --cov-report=xml

      - name: Verify the seed data is self-consistent
        run: |
          python -m scripts.seed --reset
          python scripts/verify_seed.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          flags: backend
          # Codecov being down, or this repo not yet activated on codecov.io,
          # must never fail the build.
          fail_ci_if_error: false

  postgres:
    name: Test suite (Postgres)
    # Production runs on Postgres (Neon). The main job uses SQLite for speed;
    # this one runs the same suite against a real Postgres, which is the only
    # place full-text search, the migration lock and the search index run.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: judge
          POSTGRES_PASSWORD: judge
          POSTGRES_DB: judge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U judge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://judge:judge@localhost:5432/judge
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      EXECUTION_BACKEND: local
      ADMIN_EMAILS: admin@example.com
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pull the Python sandbox image
        run: docker pull python:3.11-slim
      - name: Migrate an empty database, as a fresh deploy does
        run: python -m app.migrate
      - name: Run tests
        # The per-language sandbox tests do not touch the database and
        # already run in the main job.
        run: pytest -q -p no:cacheprovider --ignore=tests/test_languages.py -o addopts=""
      - name: Seed, then boot-migrate the seeded database
        run: |
          python -m scripts.seed --reset
          python scripts/verify_seed.py
          python -m app.migrate

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        run: docker build -t online-coding-judge:ci .

      - name: Every language runs inside the image
        # The image is what Render deploys, so this is the test that matters:
        # all ten languages accepted, compile errors, time and memory limits,
        # judged by the same sandbox the live site uses.
        run: |
          docker run --rm \
            -e REQUIRE_ALL_TOOLCHAINS=1 \
            -e DATABASE_URL=sqlite:///./languages.db \
            -e SECRET_KEY=ci-secret \
            -e EXECUTION_BACKEND=local \
            online-coding-judge:ci \
            python -m pytest tests/test_languages.py -q -p no:cacheprovider -o addopts=""
      - name: Container starts and answers its health check
        run: |
          docker run -d --name judge \
            -e DATABASE_URL=sqlite:///./ci.db \
            -e SECRET_KEY=ci-secret \
            -e EXECUTION_BACKEND=local \
            -p 8000:8000 online-coding-judge:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/ping; then exit 0; fi
            sleep 2
          done
          echo "Service did not become healthy"; docker logs judge; exit 1
