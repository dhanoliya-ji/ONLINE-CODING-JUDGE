# =========================================================================
#  Render Blueprint - https://render.com/docs/blueprint-spec
#
#  Deploys on Render's NATIVE PYTHON runtime, not Docker. Render's free tier
#  does not expose a Docker socket, so the container sandbox could never have
#  run there anyway; building an image only added a slow, fragile build step
#  for no isolation benefit. `pip install` on the native runtime is faster and
#  has far fewer moving parts.
#
#  The Docker sandbox is still the real one - use `docker compose up` locally
#  to run submissions with full container isolation.
#
#  DATABASE_URL is deliberately NOT defined here: set it in the Render
#  dashboard so the credential never lands in version control.
# =========================================================================

services:
  - type: web
    name: online-coding-judge
    runtime: python
    plan: free
    region: oregon
    branch: main

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --workers 2

    # Render polls this to decide whether an instance is healthy.
    healthCheckPath: /api/v1/ping

    envVars:
      # ---- Set manually in the dashboard (marked sync:false) -------------
      - key: DATABASE_URL
        sync: false          # paste your Neon pooled connection string here
      - key: ADMIN_EMAILS
        sync: false          # the email you register with, to get admin

      # ---- Generated once by Render and then held stable -----------------
      - key: SECRET_KEY
        generateValue: true

      # ---- Runtime -------------------------------------------------------
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"

      # ---- Execution engine ----------------------------------------------
      # No Docker socket on Render, so the rlimit sandbox is the only option.
      # Stated explicitly rather than letting `auto` fall back silently.
      - key: EXECUTION_BACKEND
        value: local
      - key: EXECUTION_TIME_LIMIT_MS
        value: "2000"
      - key: EXECUTION_MEMORY_LIMIT_MB
        value: "128"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
